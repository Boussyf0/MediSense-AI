name: CI

on:
  push:
    branches:
      - main
      - sprint/**
      - release/**
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: medisense_db
          POSTGRES_USER: medisense_user
          POSTGRES_PASSWORD: medisense_test_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medisense_user -d medisense_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: medisense_db
      POSTGRES_USER: medisense_user
      POSTGRES_PASSWORD: medisense_test_pw
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET_KEY: ci_dummy_secret
      PGCRYPTO_KEY: ci_dummy_pgcrypto_key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Free disk space for heavy ML deps
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q backend/app backend/scripts

      - name: Run backend tests with coverage
        run: |
          cd backend
          pytest -q --cov=app --cov-report=xml --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml

      - name: Run red-team safety smoke
        run: |
          cd backend
          python scripts/run_red_team_eval.py --output results/red_team_eval_ci.json

      - name: Enforce red-team strict pass
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          report_path = Path("backend/results/red_team_eval_ci.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          strict = float(report.get("strict_pass_rate", 0.0))
          infra = int(report.get("infra_error_cases", 0))

          print(f"strict_pass_rate={strict:.4f} infra_error_cases={infra}")
          if strict < 1.0 or infra != 0:
              sys.exit(1)
          PY

      - name: Upload red-team report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-team-ci-report
          path: backend/results/red_team_eval_ci.json

      - name: Check ML model quality gate
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          p = Path("backend/models/noshow_training_report.json")
          if not p.exists():
              print("No model report found — skipping gate"); sys.exit(0)
          m = json.loads(p.read_text())["test_metrics"]
          f1, auc = float(m.get("f1", 0)), float(m.get("auc", 0))
          print(f"ML gate: f1={f1:.4f} auc={auc:.4f}")
          if f1 < 0.80 or auc < 0.87:
              print("GATE FAILED"); sys.exit(1)
          PY

      - name: Free disk space before Docker build
        run: |
          docker system prune -af || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache || true
          df -h

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/medisense-backend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          build-args: PIP_REQUIREMENTS=requirements-ci.txt
          push: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') }}
          tags: ${{ steps.meta.outputs.tags }}

  test-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: cd frontend/mobile && flutter pub get

      - name: Run Flutter tests
        run: cd frontend/mobile && flutter test

  test-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: cd frontend/web && npm ci

      - name: Debug environment
        run: |
          cd frontend/web
          echo "=== Node/npm versions ==="
          node -v && npm -v
          echo "=== CWD ==="
          pwd
          echo "=== lib/ contents ==="
          ls -la lib/
          echo "=== vitest.config.ts ==="
          cat vitest.config.ts
          echo "=== Vite version ==="
          node -e "console.log(require('vite/package.json').version)"
          echo "=== Vitest version ==="
          node -e "console.log(require('vitest/package.json').version)"

      - name: Run web tests
        run: cd frontend/web && npm test

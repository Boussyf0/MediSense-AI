[pytest]
asyncio_mode = auto
# "function" (default) gives each test its own event loop so asyncpg
# connections are never shared across loop boundaries.
asyncio_default_fixture_loop_scope = function
# Expose backend/ root so "import scripts.*" resolves in test_mlflow_registry
pythonpath = .
# Short tracebacks match CI output; avoids wall-of-text on assertion failures
addopts = --tb=short
markers =
    timescale: tests requiring the TimescaleDB extension (auto-skip if absent)

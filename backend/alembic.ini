[alembic]
# Path to migration scripts
script_location = alembic

# Put the current directory on sys.path so env.py can `import app` when alembic
# is invoked from the project root (locally, in CI, and in the Docker image).
prepend_sys_path = .

# Migration file naming: timestamp_description.py
# e.g: 20240101_120000_add_appointments_table.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# Timezone for file timestamps
timezone = UTC

# Max length of the slug (description part of filename)
truncate_slug_length = 40

# Do not modify — connection URL is set dynamically in env.py from settings
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Automatically format migration files with black after generation
# Uncomment if black is installed:
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

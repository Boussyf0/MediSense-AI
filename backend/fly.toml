# Fly.io app config — MediSense backend (FastAPI).
# Free-tier-friendly subset: single shared-CPU 1x machine in CDG, scaled to
# zero when idle so the project stays inside the free hobby allowance.
app = "medisense-ai"
primary_region = "cdg"

[build]
  # Build context is this directory (backend/), so the Dockerfile and its
  # COPY paths (requirements*.txt, app/) resolve correctly. Deploy with
  # `cd backend && fly deploy` — never from the repo root.
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  # Make the `app` package importable by the release_command (alembic upgrade head)
  # and uvicorn regardless of working directory — alembic.ini has no prepend_sys_path.
  PYTHONPATH = "/app"
  # Fly's .flycast network is already encrypted (6PN/WireGuard); the PG server
  # doesn't serve TLS on this port. asyncpg defaults to sslmode=prefer and chokes
  # on the reset, so force SSL off. (libpq/asyncpg both honor PGSSLMODE.)
  PGSSLMODE = "disable"
  POSTGRES_HOST = "medisense-pg.flycast"
  POSTGRES_PORT = "5432"
  POSTGRES_DB = "medisense_db"
  POSTGRES_USER = "medisense_user"
  REDIS_HOST = "fly-medisense-redis.upstash.io"
  REDIS_PORT = "6379"
  # Direct 6PN private networking (.internal) — Qdrant listens on 0.0.0.0:6333.
  # Avoids needing a flycast service/ports config on the Qdrant app.
  QDRANT_HOST = "medisense-qdrant.internal"
  QDRANT_PORT = "6333"
  LLM_PROVIDER = "groq"
  GROQ_MODEL = "llama-3.1-8b-instant"
  KAFKA_BROKERS = ""           # cloud demo runs anomaly detection synchronously
  # Must be a JSON array string — Settings.CORS_ORIGINS is list[str], parsed via json.loads.
  CORS_ORIGINS = '["https://medisense-web.fly.dev","https://medisense.ma"]'

# Secrets (set via `fly secrets set <KEY>=<value>`):
#   POSTGRES_PASSWORD, JWT_SECRET_KEY, PGCRYPTO_KEY, REDIS_PASSWORD,
#   GROQ_API_KEY, FCM_SERVICE_ACCOUNT_B64

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one machine always warm. The app loads heavy ML libs and cold-starts
  # slowly (tens of seconds), so scale-to-zero causes 502/503 on the first hit.
  # Set min back to 0 to save cost when not actively demoing.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "60s"
  interval = "30s"
  method = "GET"
  path = "/api/v1/health"
  timeout = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # 512MB OOM-kills on startup; 1GB OOM-kills at runtime when chat/RAG/ML code runs
  # (spikes to ~850MB+). 2GB gives headroom for inference. Max for shared-cpu-1x.
  memory_mb = 2048

[deploy]
  # NOTE: the alembic chain is broken for a from-scratch run (the migration that
  # creates `patients` is chained last, but earlier migrations FK to it). Tests use
  # Base.metadata.create_all, which is the real source of truth, so we build the
  # schema from the ORM models here. create_all is idempotent (skips existing tables).
  # TODO: repair the migration history, then switch back to `alembic upgrade head`.
  release_command = "python scripts/init_db.py"

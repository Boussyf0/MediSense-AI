# Fly.io app config — MediSense backend (FastAPI).
# Free-tier-friendly subset: single shared-CPU 1x machine in CDG, scaled to
# zero when idle so the project stays inside the free hobby allowance.
app = "medisense-ai"
primary_region = "cdg"

[build]
  # Build context is this directory (backend/), so the Dockerfile and its
  # COPY paths (requirements*.txt, app/) resolve correctly. Deploy with
  # `cd backend && fly deploy` — never from the repo root.
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  POSTGRES_HOST = "medisense-pg.flycast"
  POSTGRES_PORT = "5432"
  POSTGRES_DB = "medisense_db"
  POSTGRES_USER = "medisense_user"
  REDIS_HOST = "fly-medisense-redis.upstash.io"
  REDIS_PORT = "6379"
  QDRANT_HOST = "<your-qdrant-cloud-host>"
  QDRANT_PORT = "6333"
  LLM_PROVIDER = "groq"
  GROQ_MODEL = "llama-3.1-8b-instant"
  KAFKA_BROKERS = ""           # cloud demo runs anomaly detection synchronously
  CORS_ORIGINS = "https://medisense-web.fly.dev,https://medisense.ma"

# Secrets (set via `fly secrets set <KEY>=<value>`):
#   POSTGRES_PASSWORD, JWT_SECRET_KEY, PGCRYPTO_KEY, REDIS_PASSWORD,
#   GROQ_API_KEY, FCM_SERVICE_ACCOUNT_B64

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/api/v1/health"
  timeout = "10s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[deploy]
  release_command = "alembic upgrade head"

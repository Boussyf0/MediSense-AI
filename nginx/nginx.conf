events {
    worker_connections 1024;
}

http {
    # ── Security Defaults ─────────────────────────────────
    server_tokens off;
    client_max_body_size 10M;

    # ── Logging ───────────────────────────────────────────
    log_format main '$remote_addr - $request - $status - $body_bytes_sent';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Rate Limiting zones — MUST be at http{} level ─────
    # limit_req_zone defines the shared memory zone
    # It cannot be inside server{} or location{} blocks
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/m;

    # ── Upstream ──────────────────────────────────────────
    upstream fastapi_backend {
        server fastapi:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS Redirect ─────────────────────────────
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Server ──────────────────────────────────────
    server {
        listen 443 ssl;
        server_name localhost;

        # TLS 1.3 only (US-02)
        ssl_certificate     /etc/nginx/certs/medisense.crt;
        ssl_certificate_key /etc/nginx/certs/medisense.key;
        ssl_protocols       TLSv1.3;
        # ssl_ciphers not needed for TLS 1.3 — all TLS 1.3 ciphers are strong by default
        # ssl_ciphers applies only to TLS 1.2 cipher strings (different format)
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Static assets (Swagger UI JS/CSS) ─────────────
        location /static/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_cache_valid 200 1d;
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # ── Proxy to FastAPI ───────────────────────────────
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout    60s;
        }

        # Stricter rate limit on login (brute force protection)
        location /api/v1/auth/login {
            limit_req zone=auth burst=3 nodelay;
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

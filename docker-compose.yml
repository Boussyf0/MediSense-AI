services:

  postgres:
    # TimescaleDB extends PostgreSQL 16 — drop-in replacement for the regular image.
    # Hypertables for biometric_reading and biometric_anomalies are created in
    # alembic migration 20260622_000000_sprint7_timescale_hypertables.py
    # (the migration is a no-op when the timescaledb extension is unavailable,
    # so plain Postgres deployments — Neon free tier, etc. — continue to work).
    image: timescale/timescaledb:2.15.0-pg16
    container_name: medisense_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    ports:
      - "5432:5432"
    networks:
      - medisense_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    container_name: medisense_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    networks:
      - medisense_network
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: medisense_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - medisense_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medisense_fastapi
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    networks:
      - medisense_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Lifespan probes Qdrant + LLM + warms LSTM — give it room before the first check.
      start_period: 45s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: medisense_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - medisense_network

  # ── Ollama (LLM_PROVIDER=ollama) ──────────────────────────────────────────
  # Mac M1/M2 : désactiver ce service et utiliser Ollama natif sur l'hôte pour
  # bénéficier de l'accélération Metal GPU (~20-40 tok/s vs 0.4 tok/s Docker CPU).
  #
  #   1. Sur le Mac : brew install ollama && ollama serve
  #   2. Dans .env  : OLLAMA_HOST=host.docker.internal
  #   3. Commenter ce bloc ollama + le volume ollama_models ci-dessous
  #
  # Pour LLM_PROVIDER=groq : ce service n'est pas nécessaire du tout.
  ollama:
    image: ollama/ollama:latest
    container_name: medisense_ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - medisense_network
    # Uncomment for NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  nginx:
    image: nginx:alpine
    container_name: medisense_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - medisense_network
    depends_on:
      - fastapi

  # ── Kafka IoT ingestion (Sprint 7 — US-25) ───────────────────────────────
  # Processes Samsung Watch BLE telemetry at 10 msg/s.
  # Set KAFKA_BROKERS=kafka:9092 in .env to enable the consumer in FastAPI.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: medisense_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - medisense_network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: medisense_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "29092:29092"
    networks:
      - medisense_network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ── IoT Simulator (Sprint 7) ──────────────────────────────────────────────
  # Replaces the missing Samsung Watch BLE gateway in dev/demo environments.
  # Publishes synthetic biometric readings to KAFKA_TOPIC_IOT at SIM_RATE_HZ.
  iot-simulator:
    build:
      context: ./backend/services/iot_simulator
    container_name: medisense_iot_simulator
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC_IOT: ${KAFKA_TOPIC_IOT:-iot-vitals}
      SIM_RATE_HZ: "10"
      SIM_ANOMALY_RATIO: "0.05"
      SIM_PATIENT_UUIDS: ${SIM_PATIENT_UUIDS:-}
    networks:
      - medisense_network

  # ── Airflow (Sprint 8 — US-34) ────────────────────────────────────────────
  # Weekly retraining DAG: medisense_retrain_noshow_weekly
  # Access UI at http://localhost:8080 (admin / medisense2026)
  airflow:
    image: apache/airflow:2.9.3-python3.12
    container_name: medisense_airflow
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # Airflow has its own database — sharing the app DB causes alembic_version
      # collisions (airflow's alembic mistakes the app's revision for its own).
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW_ADMIN_USER: admin
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_PASSWORD:-changeme}
      MEDISENSE_BACKEND_DIR: /opt/medisense/backend
      MLFLOW_PROMOTION_F1_THRESHOLD: "0.80"
      MLFLOW_PROMOTION_AUC_THRESHOLD: "0.87"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./backend:/opt/medisense/backend:ro
      - airflow_logs:/opt/airflow/logs
    ports:
      - "8080:8080"
    networks:
      - medisense_network
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create --username admin --password $${AIRFLOW_ADMIN_PASSWORD:-changeme}
          --firstname MediSense --lastname Admin --role Admin --email admin@medisense.ma || true &&
        airflow webserver &
        airflow scheduler
      "

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: medisense_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - medisense_network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'

  # ── MLflow tracking server (Sprint 8) ────────────────────────────────────
  # Reachable at http://localhost:5500. Stores metadata in the MediSense
  # Postgres (mlflow schema, auto-created on first connection) and artefacts
  # in MinIO so notebooks/training scripts can log models and registry runs.
  minio:
    image: minio/minio:latest
    container_name: medisense_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - medisense_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio-bootstrap:
    image: minio/mc:latest
    container_name: medisense_minio_bootstrap
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - medisense_network
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
        sleep 3 &&
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb -p local/mlflow-artifacts || true &&
        echo 'minio bootstrap done'
      "

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    container_name: medisense_mlflow
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    # SQLite backend keeps the official mlflow image dependency-free (no
    # psycopg2 bundled). Metadata persists in the mlflow_data volume; model
    # artefacts go to MinIO. For multi-user prod, swap to Postgres + a
    # custom image that ships psycopg2.
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/store/mlflow.db
      --default-artifact-root s3://mlflow-artifacts/
      --serve-artifacts
    volumes:
      - mlflow_data:/mlflow/store
    ports:
      - "5500:5000"
    networks:
      - medisense_network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: medisense_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-medisense2026}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/medisense_overview.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    networks:
      - medisense_network
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_models:
  prometheus_data:
  grafana_data:
  airflow_logs:
  minio_data:
  mlflow_data:

networks:
  medisense_network:
    driver: bridge
